# הגדרות בסיסיות של מסד הנתונים
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# הגדרות Hibernate ו-JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# שיניתי ל-create-drop כדי שבכל הרצה ב-VS Code תקבל מסד נתונים נקי ללא שגיאות כפילות
spring.jpa.hibernate.ddl-auto=create-drop

# --- פתרון לשגיאת ה-NUMBER וה-TIME ---
# הגדרה זו מוסיפה גרשיים אוטומטיים לכל שמות העמודות כדי למנוע התנגשות עם מילים שמורות ב-H2
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# אפשור ה-H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# הגדרות הרצת סקריפטים (data.sql)
spring.sql.init.mode=always
# קריטי: גורם ל-Spring להמתין שהטבלאות ייווצרו לפני שהוא מריץ את ה-INSERT
spring.jpa.defer-datasource-initialization=true

# מציג את השאילתות בטרמינל כדי שנוכל לעקוב אחרי מה שקורה
spring.jpa.show-sql=true